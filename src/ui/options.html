<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tiny Website Blocker</title>
    <link rel="stylesheet" href="options.css">
</head>
<body>
<main id="appContent">
    <header class="pageHeader">
        <div class="titleBlock">
            <img class="appIcon" src="icons/website_blocker_icon_48x48.png" alt="Tiny Website Blocker icon">
            <div>
                <h1>Tiny Website Blocker</h1>
                <p class="subtitle">Keep distractions out by listing the sites you want to block.</p>
            </div>
        </div>
        <div class="headerActions">
            <button id="refreshButton" class="ghostButton">Refresh list</button>
        </div>
    </header>
    <div id="websiteList">
        <div class="header">
            <div class="websiteHeader">Website</div>
            <div class="actionHeader">Blocked</div>
        </div>
    </div>
    <div id="pagination" class="pagination">
        <button id="prevPageButton" class="ghostButton">Prev</button>
        <div id="pageNumbers" class="pageNumbers"></div>
        <button id="nextPageButton" class="ghostButton">Next</button>
        <div id="pageInfo" class="pageInfo"></div>
    </div>
    <div id="addWebsite">
        <input type="text" id="newWebsite" placeholder="Enter a website (example.com)" aria-describedby="addWebsiteStatus">
        <button id="addButton">Add site</button>
        <p id="addWebsiteStatus" class="formHint" aria-live="polite"></p>
    </div>
    <section id="scheduleDialog" class="scheduleDialog" role="dialog" aria-modal="true" aria-labelledby="scheduleDialogTitle" hidden>
        <div class="scheduleDialogCard">
            <h2 id="scheduleDialogTitle" class="sectionTitle">Edit schedule</h2>
            <p id="scheduleRuleName" class="subtitle"></p>
            <fieldset>
                <legend>Active days</legend>
                <div class="dayChoices">
                    <label><input type="checkbox" name="scheduleDay" value="1">Mon</label>
                    <label><input type="checkbox" name="scheduleDay" value="2">Tue</label>
                    <label><input type="checkbox" name="scheduleDay" value="3">Wed</label>
                    <label><input type="checkbox" name="scheduleDay" value="4">Thu</label>
                    <label><input type="checkbox" name="scheduleDay" value="5">Fri</label>
                    <label><input type="checkbox" name="scheduleDay" value="6">Sat</label>
                    <label><input type="checkbox" name="scheduleDay" value="0">Sun</label>
                </div>
            </fieldset>
            <fieldset>
                <legend>Blocking period</legend>
                <div class="timeFields">
                    <label>From <input id="scheduleStart" type="time" value="09:00"></label>
                    <span>to</span>
                    <label><input id="scheduleEnd" type="time" value="17:00"></label>
                </div>
                <p class="formHint">Overnight periods are supported.</p>
            </fieldset>
            <p id="scheduleStatus" class="formHint" aria-live="polite"></p>
            <div class="scheduleDialogActions">
                <button id="removeScheduleButton" class="dangerButton" type="button">Remove schedule</button>
                <span class="actionSpacer"></span>
                <button id="cancelScheduleButton" class="ghostButton" type="button">Cancel</button>
                <button id="saveScheduleButton" type="button">Save schedule</button>
            </div>
        </div>
    </section>
    <section class="transferCard" aria-labelledby="transferTitle">
        <div>
            <h2 id="transferTitle" class="sectionTitle">Backup and restore</h2>
            <p class="subtitle">Export or import rules and the global blocking setting. Statistics stay private.</p>
        </div>
        <div class="transferActions">
            <button id="exportButton" type="button" class="ghostButton">Export JSON</button>
            <button id="importButton" type="button">Import JSON</button>
            <input id="importFile" type="file" accept="application/json,.json" hidden>
        </div>
        <p id="transferStatus" class="formHint" aria-live="polite"></p>
    </section>
</main>
<script src="../options.js"></script>
</body>
</html>
